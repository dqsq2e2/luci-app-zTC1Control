name: Build packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 24.10 (ipk)
            arch: x86_64-openwrt-24.10
            artifacts: |
              bin/packages/**/*.ipk
          - name: OpenWrt 25.12 (apk)
            arch: x86_64-openwrt-25.12
            artifacts: |
              bin/packages/**/*.apk
          - name: OpenWrt snapshot (apk)
            arch: x86_64-SNAPSHOT
            artifacts: |
              bin/packages/**/*.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: ghcr.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}
          FEEDNAME: ztc1
          PACKAGES: luci-app-ztc1control
          V: s

      - name: Show built packages
        run: |
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) -print

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect packages
        run: |
          mkdir -p release
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp -v {} release/ \;
          ls -l release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
